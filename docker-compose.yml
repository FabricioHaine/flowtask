services:
  postgres:
    image: postgres:18-alpine
    container_name: flowtask-postgres
    environment:
      POSTGRES_DB: flowtask
      POSTGRES_USER: flowtask
      POSTGRES_PASSWORD: ${DB_PASSWORD:-troque-esta-senha}
    ports:
      - "5432:5432"
    volumes:
      - dados_pg_flowtask:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  dados_pg_flowtask:
