spring:
  application:
    name: flowtask-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flowtask}
    username: ${DB_USER:flowtask}
    password: ${DB_PASSWORD:flowtask}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  error:
    include-message: never

app:
  seguranca:
    jwt:
      # Valor SOMENTE para desenvolvimento local. Em produção, defina JWT_SECRET
      # com um segredo de 64 bytes aleatórios em base64.
      segredo: ${JWT_SECRET:c3Blcm1lZGFuLWp3dC1zZWdyZWRvLWRlLWRldi0zMi1ieXRlcy1iYXNlNjQtcXVlLW5hby11cy1wcm9kLWluZG8tdXNlLXNlZ3JlZG8tdGl0dWxhci1kZS1kZXZlbg==}
      expiracao-segundos: ${JWT_EXPIRACAO_SEGUNDOS:28800}
    cors:
      origens: ${CORS_ORIGINS:http://localhost:4200}
    senhas:
      # Política: mínimo 8 caracteres, pelo menos 1 letra e 1 número.
      padrao: "^(?=.*[A-Za-z])(?=.*\\d).{8,64}$"
      mensagem: "A senha deve ter de 8 a 64 caracteres, incluindo pelo menos 1 letra e 1 número."
  convites:
    expiracao-dias: ${CONVITE_EXPIRACAO_DIAS:7}
  email:
    habilitado: ${EMAIL_HABILITADO:false}
    remetente: ${MAIL_FROM:flowtask@localhost}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.springframework.security: INFO
